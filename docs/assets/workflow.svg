<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">From agent work to a local dashboard</title>
<desc id="desc">The main agent publishes facts. The optional designer supplies presentation. The Python publisher validates and timestamps those inputs, producing one offline HTML dashboard. You answer in the agent chat.</desc>
<rect width="1400" height="420" fill="#f6f5f1"/>
<g font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#686e60">
<text x="38" y="40">01 / YOUR AGENT SESSION</text><text x="561" y="40">02 / LOCAL PUBLISHER</text><text x="1044" y="40">03 / YOUR BROWSER</text>
</g>
<g stroke="#d6d9cc" fill="#fffefa">
<rect x="38" y="70" width="370" height="117" rx="5"/>
<rect x="38" y="223" width="370" height="117" rx="5"/>
<rect x="561" y="123" width="306" height="166" rx="5"/>
<rect x="1044" y="123" width="318" height="166" rx="5"/>
</g>
<path d="M38 71v115" stroke="#ae5630" stroke-width="3"/>
<g font-family="Georgia,serif" font-size="26" fill="#272923">
<text x="62" y="112">Main agent</text><text x="62" y="265">Dashboard designer</text>
<text x="584" y="164">Validate + publish</text><text x="1068" y="164">One HTML file</text>
</g>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#646b5b">
<text x="62" y="148">Does the work. Records actual progress.</text>
<text x="62" y="301">Optional. Styles the view in the background.</text>
<text x="584" y="202">Checks revisions and decisions.</text><text x="584" y="233">Uses the real system clock.</text>
<text x="1068" y="202">Open beside your editor.</text><text x="1068" y="233">Refreshes during active work.</text>
</g>
<g stroke="#89917d" stroke-width="2" fill="none">
<path d="M408 129h76v55h64M408 282h76v-55h64M867 206h163"/>
<path d="M539 178l9 6-9 6M539 221l9 6-9 6M1021 200l9 6-9 6"/>
</g>
<g font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#646b5b">
<text x="422" y="114">FACTS</text><text x="420" y="304">DESIGN</text><text x="903" y="192">OFFLINE</text>
</g>
<path d="M38 375H1362" stroke="#d6d9cc"/>
<text x="38" y="405" fill="#646b5b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">Read progress in the browser. Answer questions in your agent chat. Required decisions wait for you.</text>
</svg>
