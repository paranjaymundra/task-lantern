<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">One task, two roles, one clear view</title><desc id="desc">The main agent works and publishes facts. The dashboard builder designs the presentation. Both feed one offline HTML dashboard.</desc>
