<g font-family="system-ui,-apple-system,sans-serif" fill="#eef2e9"><text x="60" y="74" font-size="20">Main agent</text><text x="60" y="190" font-size="20">Dashboard builder</text><text x="578" y="119" font-size="20">Local publisher</text><text x="957" y="119" font-size="20">Your dashboard</text></g>
<g font-family="system-ui,-apple-system,sans-serif" fill="#a6b3a9" font-size="14"><text x="60" y="102">Does the work. Records the facts.</text><text x="60" y="218">Designs the view. Runs alongside.</text><text x="578" y="151">Validates + timestamps</text><text x="578" y="175">One writer. Real progress.</text><text x="957" y="151">One HTML file</text><text x="957" y="175">Refreshes every 10s</text></g>
